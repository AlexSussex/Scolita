<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>Școlița — the 12 profile avatars</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#FFD93D}a:hover{color:#FFF3B0}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; box-sizing: border-box; background: linear-gradient(180deg, #2B1B5A 0%, #4B2C8F 100%); font-family: 'Baloo 2', system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; padding-top: 64px; gap: 48px">

<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<h1 style="margin: 0; font-size: 48px; font-weight: 800; line-height: 1.1">Pozele de profil</h1>
<span style="font-size: 22px; font-weight: 600; color: #E8EEF8">14 poze: fiecare copil își alege una</span>
</div>

<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 20px; width: 1180px">
<sc-for list="{{ avatars }}" as="av" hint-placeholder-count="14">
<div style="height: 200px; border-radius: 32px; background: #FFF8EC; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 10px 0 rgba(0,0,0,0.2)">
<dc-import name="Avatar" kind="{{ av.kind }}" size="{{ av.size }}" hint-size="130px,130px"></dc-import>
<span style="font-size: 22px; font-weight: 800; color: #2A2140; line-height: 1">{{ av.label }}</span>
</div>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const list = [
['kitty', 'Pisicuța'], ['cat', 'Pisica mov'], ['unicorn', 'Unicornul'], ['rocket', 'Racheta'], ['star', 'Steaua'],
['moon', 'Luna'], ['planet', 'Planeta'], ['whale', 'Balena'], ['guitar', 'Chitara'],
['bicycle', 'Bicicleta'], ['rainbow', 'Curcubeul'], ['fox', 'Vulpea'], ['owl', 'Bufnița'], ['dog', 'Cățelul']
];
return { avatars: list.map(([kind, label]) => ({ kind, label, size: 130 })) };
}
}
</script>
</body>
</html>
