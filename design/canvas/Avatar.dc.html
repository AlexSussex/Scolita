class Component extends DCLogic {
renderVals() {
const kind = this.props.kind ?? 'cat';
const labels = {
kitty: 'Pisicuța', cat: 'Pisica mov', unicorn: 'Unicornul', rocket: 'Racheta', star: 'Steaua',
moon: 'Luna', planet: 'Planeta', whale: 'Balena', guitar: 'Chitara',
bicycle: 'Bicicleta', rainbow: 'Curcubeul', fox: 'Vulpea', owl: 'Bufnița', dog: 'Cățelul'
};
const size = this.props.size ?? 200;
return {
px: size + 'px',
label: labels[kind] ?? labels.cat,
isKitty: kind === 'kitty', isCat: kind === 'cat', isUnicorn: kind === 'unicorn', isRocket: kind === 'rocket',
isStar: kind === 'star', isMoon: kind === 'moon', isPlanet: kind === 'planet',
isWhale: kind === 'whale', isGuitar: kind === 'guitar', isBicycle: kind === 'bicycle',
isRainbow: kind === 'rainbow', isFox: kind === 'fox', isOwl: kind === 'owl', isDog: kind === 'dog'
};
}
}
</script>
